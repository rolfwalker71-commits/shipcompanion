services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: ghcr.io/rolfwalker71-commits/shipcompanion:latest
    pull_policy: always
    ports:
      - "3344:3344"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      PORT: 3344
      NODE_ENV: production
      # Hinter HTTPS-Proxy: in der Server-.env COOKIE_SECURE=true setzen,
      # falls der Proxy kein X-Forwarded-Proto schickt. Nicht hier hart auf true
      # setzen — sonst bricht der Login im LAN über HTTP.
    restart: unless-stopped
